[package]
name = "font-ml"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Run small local models over font sources: outlines, spacing, kerning. For people, editors, and agents."
repository = "https://github.com/eliheuer/font-ml"
readme = "README.md"
keywords = ["font", "type-design", "machine-learning", "ufo", "glyph"]
categories = ["science", "graphics"]

[[bin]]
name = "font-ml"
path = "src/bin/font-ml.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Verified 2026-09-01: candle 0.11 builds on stable rustc 1.96 with
# accelerate on aarch64. The old nightly-only note no longer applies.
candle-core = "0.11"
candle-nn = "0.11"
# The chat runtime: candle's quantized Qwen3 over a GGUF file, and the
# HF tokenizer it needs. Both to vet.
candle-transformers = "0.11"
tokenizers = "0.22"
kurbo = "0.13"
norad = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The task list is a published contract: every type a caller reads back
# carries a JSON Schema.
schemars = "1.2"
thiserror = "2"

[features]
# Apple's BLAS. A boldening run is dominated by small matmuls, so this
# is the difference between usable and not on macOS.
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# Apple's GPU, for the chat models. Verified to build on stable when
# added; see the plan's PROGRESS for the measured speeds.
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# NVIDIA. Wired, not tested here: no CUDA machine on this desk.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dev-dependencies]
tempfile = "3"
